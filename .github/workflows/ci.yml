name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  build:

    runs-on: ubuntu-latest


    steps:

      # 1. Download repository code
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Install Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # 3. Install packages
      - name: Install dependencies
        run: npm ci


      # 4. Check code quality
      # - name: Run lint
      #   run: npm run lint


      # 5. Build application
      - name: Build application
        run: npm run build