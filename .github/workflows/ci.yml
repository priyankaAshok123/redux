name: React CI/CD


on:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4



      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm



      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci



      # 4. Lint
      - name: Run lint
        run: npm run lint



      # 5. Build React app
      - name: Build React app
        run: npm run build



      # 6. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}



      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/redux-app:latest .



      # 8. Push Docker image
      - name: Push Docker image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/redux-app:latest